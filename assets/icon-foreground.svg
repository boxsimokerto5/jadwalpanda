<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fgGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="fgEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="fgCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="fgInnerShield" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0F3E35" />
      <stop offset="50%" stop-color="#082520" />
      <stop offset="100%" stop-color="#031613" />
    </linearGradient>
    <filter id="fgShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Centered inside Android Adaptive Icon Safe Zone (Diameter 330px within 512px canvas) -->
  <!-- 24h Orbit Track -->
  <circle cx="256" cy="244" r="162" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 8" opacity="0.45" />

  <!-- Orbit Sweeps -->
  <path d="M 140 126 A 162 162 0 0 1 372 126" fill="none" stroke="url(#fgGoldGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 372 126 A 162 162 0 0 1 256 406" fill="none" stroke="url(#fgEmeraldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.85" />
  <path d="M 256 406 A 162 162 0 0 1 140 126" fill="none" stroke="url(#fgCyanGrad)" stroke-width="2.5" stroke-dasharray="5 7" opacity="0.7" />

  <!-- Main Shield -->
  <g filter="url(#fgShadow)">
    <path d="M 256 86 C 326 86, 372 108, 381 178 C 385 246, 351 324, 256 370 C 161 324, 127 246, 131 178 C 140 108, 186 86, 256 86 Z" fill="url(#fgGoldGrad)" />
    <path d="M 256 93 C 321 93, 363 113, 372 180 C 376 242, 344 314, 256 358 C 168 314, 136 242, 140 180 C 149 113, 191 93, 256 93 Z" fill="#062620" />
    <path d="M 256 100 C 314 100, 352 119, 360 180 C 364 236, 336 304, 256 346 C 176 304, 148 236, 152 180 C 160 119, 198 100, 256 100 Z" fill="url(#fgInnerShield)" />
  </g>

  <!-- Pinnacle Star -->
  <g transform="translate(256, 115)">
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="url(#fgGoldGrad)" />
  </g>

  <!-- Guardian and Santri Core Symbol -->
  <circle cx="256" cy="172" r="20" fill="url(#fgGoldGrad)" />
  <circle cx="256" cy="172" r="16" fill="#082A23" />
  <circle cx="256" cy="172" r="12" fill="url(#fgGoldGrad)" />

  <!-- Hands / Wings of Custody -->
  <path d="M 240 204 C 202 208, 178 238, 183 274 C 187 298, 208 314, 236 320 C 218 309, 210 289, 210 270 C 211 243, 225 223, 249 212 Z" fill="url(#fgEmeraldGrad)" />
  <path d="M 272 204 C 310 208, 334 238, 329 274 C 325 298, 304 314, 276 320 C 294 309, 302 289, 302 270 C 301 243, 287 223, 263 212 Z" fill="url(#fgEmeraldGrad)" />

  <circle cx="256" cy="228" r="10" fill="url(#fgGoldGrad)" />
  <path d="M 256 264 L 233 250 C 240 245, 249 243, 256 247 C 263 243, 272 245, 279 250 Z" fill="url(#fgCyanGrad)" />
  <path d="M 256 266 L 228 282 L 237 286 L 256 271 L 275 286 L 284 282 Z" fill="url(#fgGoldGrad)" />

  <!-- 24H Badge -->
  <g transform="translate(256, 388)">
    <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#062922" stroke="url(#fgGoldGrad)" stroke-width="2" />
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" letter-spacing="3" fill="url(#fgGoldGrad)">WALI ASUH</text>
  </g>
</svg>
